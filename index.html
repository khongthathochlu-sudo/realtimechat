<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realtime Chat</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface-2: #22222f;
      --border: #2e2e3e;
      --text: #e8e8f0;
      --text-muted: #8888a0;
      --accent: #6c63ff;
      --accent-hover: #5a52e0;
      --sent: #6c63ff;
      --received: #2a2a3a;
      --system: #3a3a50;
      --online: #4ade80;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(108, 99, 255, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(108, 99, 255, 0.05) 0%, transparent 50%);
    }

    /* ── Login overlay ── */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .login-card .logo {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }

    .login-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .login-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    .login-card input {
      width: 100%;
      padding: 14px 18px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }

    .login-card input:focus {
      border-color: var(--accent);
    }

    .login-card button {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .login-card button:hover {
      background: var(--accent-hover);
    }

    .login-card button:active {
      transform: scale(0.98);
    }

    /* ── Chat container ── */
    .chat-app {
      width: 100%;
      max-width: 720px;
      height: 90dvh;
      max-height: 820px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .chat-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface-2);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .header-info h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .header-info .status {
      font-size: 0.78rem;
      color: var(--online);
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--online);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Messages area ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 4px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    /* System message */
    .msg-system {
      align-self: center;
      background: var(--system);
      color: var(--text-muted);
      font-size: 0.78rem;
      padding: 5px 14px;
      border-radius: 20px;
      max-width: 80%;
      text-align: center;
    }

    /* Message row */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 75%;
      animation: fadeIn 0.25s ease;
    }

    .msg-row.sent {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.received {
      align-self: flex-start;
      align-items: flex-start;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-sender {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .msg-bubble {
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      position: relative;
    }

    .msg-row.sent .msg-bubble {
      background: var(--sent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-row.received .msg-bubble {
      background: var(--received);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg-time {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }

    /* Typing indicator */
    .typing-indicator {
      display: none;
      align-self: flex-start;
      padding: 10px 16px;
      background: var(--received);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      gap: 4px;
      align-items: center;
    }

    .typing-indicator.visible {
      display: flex;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* ── Input area ── */
    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface-2);
    }

    .input-area textarea {
      flex: 1;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    .input-area textarea:focus {
      border-color: var(--accent);
    }

    .input-area textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 46px;
      height: 46px;
      background: var(--accent);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }

    .send-btn:hover {
      background: var(--accent-hover);
    }

    .send-btn:active {
      transform: scale(0.93);
    }

    .send-btn svg {
      width: 20px;
      height: 20px;
      fill: #fff;
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Login overlay -->
  <div id="login-overlay">
    <div class="login-card">
      <div class="logo">💬</div>
      <h1>Realtime Chat</h1>
      <p>Nhập tên của bạn để bắt đầu trò chuyện</p>
      <input type="text" id="username-input" placeholder="Tên của bạn..." maxlength="30" autofocus>
      <button id="join-btn">Tham gia phòng chat</button>
    </div>
  </div>

  <!-- Chat app -->
  <div class="chat-app">
    <div class="chat-header">
      <div class="avatar" id="header-avatar">?</div>
      <div class="header-info">
        <h2 id="header-name">Phòng Chat</h2>
        <div class="status">
          <span class="status-dot"></span>
          Đang kết nối realtime
        </div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="typing-indicator" id="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>

    <div class="input-area">
      <textarea
        id="message-input"
        placeholder="Nhập tin nhắn..."
        rows="1"
        disabled
      ></textarea>
      <button class="send-btn" id="send-btn" disabled title="Gửi">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let username = '';
    let typingTimer = null;
    let isTyping = false;

    const loginOverlay   = document.getElementById('login-overlay');
    const usernameInput  = document.getElementById('username-input');
    const joinBtn        = document.getElementById('join-btn');
    const messagesEl     = document.getElementById('messages');
    const messageInput   = document.getElementById('message-input');
    const sendBtn        = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');
    const headerAvatar   = document.getElementById('header-avatar');
    const headerName     = document.getElementById('header-name');

    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    }

    function appendSystem(text) {
      const el = document.createElement('div');
      el.className = 'msg-system';
      el.textContent = text;
      messagesEl.insertBefore(el, typingIndicator);
      scrollToBottom();
    }

    function appendMessage({ id, username: sender, message, timestamp }, isSent) {
      const row = document.createElement('div');
      row.className = `msg-row ${isSent ? 'sent' : 'received'}`;

      if (!isSent) {
        const senderEl = document.createElement('div');
        senderEl.className = 'msg-sender';
        senderEl.textContent = sender;
        row.appendChild(senderEl);
      }

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = message;
      row.appendChild(bubble);

      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.textContent = formatTime(timestamp);
      row.appendChild(timeEl);

      messagesEl.insertBefore(row, typingIndicator);
      scrollToBottom();
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function joinChat() {
      const name = usernameInput.value.trim();
      if (!name) {
        usernameInput.focus();
        usernameInput.style.borderColor = '#ef4444';
        return;
      }
      username = name;
      socket.emit('join', username);

      headerAvatar.textContent = username.charAt(0).toUpperCase();
      headerName.textContent = username;

      loginOverlay.style.display = 'none';
      messageInput.disabled = false;
      sendBtn.disabled = false;
      messageInput.focus();

      appendSystem(`Chào mừng ${username}! Bạn đã tham gia phòng chat.`);
    }

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      socket.emit('chat-message', { message: text });
      messageInput.value = '';
      messageInput.style.height = 'auto';
      socket.emit('stop-typing');
      isTyping = false;
    }

    joinBtn.addEventListener('click', joinChat);
    usernameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') joinChat();
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';

      if (!isTyping) {
        isTyping = true;
        socket.emit('typing');
      }
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        isTyping = false;
        socket.emit('stop-typing');
      }, 1500);
    });

    socket.on('chat-message', (data) => {
      const isSent = data.id === socket.id;
      appendMessage(data, isSent);
    });

    socket.on('user-joined', ({ username: name }) => {
      appendSystem(`${name} đã tham gia phòng chat.`);
    });

    socket.on('user-left', ({ username: name }) => {
      appendSystem(`${name} đã rời phòng chat.`);
    });

    socket.on('typing', ({ username: name }) => {
      if (name !== username) {
        typingIndicator.classList.add('visible');
        scrollToBottom();
      }
    });

    socket.on('stop-typing', () => {
      typingIndicator.classList.remove('visible');
    });
  </script>
</body>
</html>
