<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime Chat với Danh sách Online</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f13;
            color: #e8e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        /* Khung chứa lớn chia thành 2 cột: Sidebar và Chat */
        .chat-container {
            display: flex;
            width: 900px;
            max-width: 95%;
            height: 600px;
            background-color: #1a1a24;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        /* CỘT TRÁI: Thanh theo dõi người online */
        .sidebar {
            width: 250px;
            background-color: #22222f;
            border-right: 1px solid #2e2e3e;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .sidebar h3 {
            font-size: 14px;
            margin-bottom: 15px;
            color: #8888a0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .user-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }
        .user-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background-color: #1a1a24;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }
        /* Chấm tròn xanh lá thể hiện đang online */
        .user-status {
            width: 8px;
            height: 8px;
            background-color: #2ecc71;
            border-radius: 50%;
            margin-right: 10px;
        }
        /* CỘT PHẢI: Khung chat chính */
        .chat-main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: #1a1a24;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #2e2e3e;
        }
        .chat-header h2 { font-size: 18px; }
        .chat-header p { font-size: 12px; color: #2ecc71; }
        .messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg-box {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
        }
        .msg-system {
            align-self: center;
            background-color: #2b2b3a;
            color: #8888a0;
            font-size: 12px;
        }
        .msg-other {
            align-self: flex-start;
            background-color: #22222f;
        }
        .msg-me {
            align-self: flex-end;
            background-color: #6c5ce7;
        }
        .input-area {
            padding: 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #2e2e3e;
        }
        input {
            flex-grow: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #22222f;
            color: #e8e8f0;
            outline: none;
        }
        button {
            padding: 0 20px;
            border: none;
            border-radius: 8px;
            background-color: #6c5ce7;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #5a4bda; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="sidebar">
        <h3>Đang online (<span id="user-count">0</span>)</h3>
        <ul id="user-list" class="user-list">
            </ul>
    </div>

    <div class="chat-main">
        <div class="chat-header">
            <h2 id="my-name">Đang kết nối...</h2>
            <p>● Máy chủ trực tuyến</p>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Nhập tin nhắn..." autocomplete="off">
            <button id="send-btn">Gửi</button>
        </div>
    </div>
</div>

<script>
    const socket = io();
    // --- ĐOẠN 1: KIỂM TRA MẬT KHẨU PHÒNG CHAT ---
    const CHAT_ROOM_PASSWORD = "08032025"; // Bạn muốn đặt mật khẩu là gì thì sửa ở đây
    let isPasswordCorrect = false;

    while (!isPasswordCorrect) {
        let enteredPassword = prompt("Vui lòng nhập mật khẩu để vào phòng chat:");
        
        if (enteredPassword === CHAT_ROOM_PASSWORD) {
            isPasswordCorrect = true; 
        } else {
            alert("Sai mật khẩu rồi! Vui lòng thử lại.");
        }
    }

    // --- ĐOẠN 2: XỬ LÝ GHI NHỚ TÊN NGƯỜI DÙNG ---
    let myName = localStorage.getItem('chat_username');

    if (!myName) {
        myName = prompt("Nhập tên của bạn để tham gia phòng chat:") || "User_" + Math.floor(Math.random() * 1000);
        localStorage.setItem('chat_username', myName);
    }
    
    document.getElementById('my-name').innerText = `Tài khoản: ${myName}`;
    
    // Gửi tên của mình lên để server lưu trữ
    socket.emit('join', myName);

    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const userListUl = document.getElementById('user-list');
    const userCountSpan = document.getElementById('user-count');

    // Nhận danh sách cập nhật online từ server gửi về
    socket.on('updateUserList', (userList) => {
        userListUl.innerHTML = ''; // Reset danh sách cũ
        userCountSpan.innerText = userList.length; // Cập nhật số lượng người online
        
        userList.forEach(username => {
            const li = document.createElement('li');
            li.className = 'user-item';
            li.innerHTML = `<div class="user-status"></div> ${username}`;
            userListUl.appendChild(li);
        });
    });

    // Nhận tin nhắn chat công khai
    socket.on('message', (data) => {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('msg-box');
        
        if (data.user === 'Hệ thống') {
            msgDiv.classList.add('msg-system');
            msgDiv.innerText = data.text;
        } else if (data.user === myName) {
            msgDiv.classList.add('msg-me');
            msgDiv.innerText = `Bạn: ${data.text}`;
        } else {
            msgDiv.classList.add('msg-other');
            msgDiv.innerText = `${data.user}: ${data.text}`;
        }
        
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight; // Tự động cuộn màn hình xuống tin nhắn cuối
    });

    // Hàm thực hiện gửi tin
    function sendMessage() {
        const text = msgInput.value.trim();
        if (text) {
            socket.emit('chatMessage', text);
            msgInput.value = '';
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
